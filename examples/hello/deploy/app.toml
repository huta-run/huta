# The repo side of the contract (DESIGN.md C1). Data only: the host decides users, ports and hosts.
schema = 1
project = "hello"
order = ["web"]          # top-level keys must come before the first [table] in TOML

[images.web]
dockerfile = "examples/hello/Dockerfile"
context = "examples/hello"

[components.web]
image = "web"
kind = "http"
port = 8080
health = "/healthz"

[state]
kind = "none"
