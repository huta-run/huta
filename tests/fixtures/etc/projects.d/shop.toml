# Test fixture: several containers per target (DESIGN-v2 §3).
schema = 1
project = "shop"
repo = "example/shop"
app_toml = "deploy/app.toml"
uid = 29003

[targets.prod]
hosts = ["shop.example.org"]
slots = [19130, 19131]
secrets = ["SHOP_SESSION_KEY"]
data = { size = "1g", backup = "daily" }
worker_liveness = 5

[targets.prod.components.api]
limits = { memory = "512m", cpus = 1 }
env = { API_MODE = "full" }
secrets = ["API_DB_KEY"]

[targets.live]
hosts = ["live.shop.example.org"]
slots = [19132, 19133]
